# PitWall pipeline config. Every stage reads this file.
# Change values here, not in code, so runs stay reproducible.

seed: 42

seasons: [2022, 2023, 2024, 2025]
train_seasons: [2022, 2023, 2024]   # model fitting + grouped CV (2022 added after the midpoint)
test_seasons: [2025]          # locked holdout, only touched for final evaluation

paths:
  external: data/external     # archive clones / FastF1 cache
  raw: data/raw               # one canonical parquet per race
  interim: data/interim       # cleaned laps (all laps + filter flags)
  processed: data/processed   # model-ready feature table
  figures: reports/figures
  metrics: reports/metrics
  models: models              # final fitted models for the dashboard (gitignored)

ingest:
  # "archive": TracingInsights GitHub archive (FastF1 output saved per session).
  # "fastf1":  call the FastF1 API directly (needs access to livetiming.formula1.com).
  source: archive
  archive:
    url: https://github.com/TracingInsights/{year}
    # pinned commits so every teammate ingests the exact same files
    commits:
      2022: df396d091c4a40a3a6b733631da3497f8c91d89f
      2023: 737c84d3ae14b9883a671ca248d015b69cf1cb58
      2024: d1543a71370d9b617b627319f8ad80b2f85dfd5e
      2025: dfb3ea3f50b69857fe8e40cabe5e899743c59f6a

cleaning:
  dry_compounds: [SOFT, MEDIUM, HARD]
  wet_compounds: [INTERMEDIATE, WET]
  wet_race_lap_share: 0.10    # drop a race if >10% of its laps are on inter/wet tires
  sc_track_codes: ["4", "5", "6", "7"]   # SC, red flag, VSC, VSC ending
  quicklap_threshold: 1.07    # drop laps slower than 107% of the race's fastest lap
  outlier_window: 5           # rolling median window inside a stint
  outlier_mad_k: 5.0          # robust z cutoff for within-stint outliers
  outlier_min_s: 1.0          # never flag a residual smaller than this (seconds)
  # Monaco is excluded on purpose: 2024 was a red-flag one-stop race driven well off
  # pace, and 2025 had a mandatory two-stop rule with deliberate slow driving, so lap
  # times there reflect race management, not tire wear (val MAE was ~3x other races).
  exclude_events: [Monaco Grand Prix]

fuel:
  start_kg: 110.0             # max race fuel allowed, assumed burned linearly to 0
  s_per_kg: 0.03              # lap time cost per kg of fuel (about 0.3 s per 10 kg)

target:
  reference_laps: 3           # stint reference pace = median of first 3 clean laps
  min_clean_laps: 6           # stint must have 3 reference laps + 3 target laps
  history_laps: 5             # setup B: first 5 target laps are "observed", forecast the rest

features:
  numeric:
    - stint_lap
    - tyre_life
    - tyre_life_start
    - stint
    - fresh_tyre
    - track_temp
    - air_temp
    - humidity
    - laps_remaining
    - race_progress
    - gap_ahead_s
    - position
    - prac_slope_field          # practice long-run wear (s/lap) for this weekend and compound
  categorical:
    - compound
    - circuit
    - team
  # Final feature set: weather (track_temp, air_temp, humidity) is dropped. At the
  # midpoint it had negative permutation importance; with tuned models, removing it
  # lowered CV MAE for 7 of 8 models (see reports/metrics/weather_ablation.csv).
  drop_weather: true
  # setup B adds what a strategist already knows mid-stint (first laps on the set)
  history: [early_deg_mean, early_deg_slope, laps_ahead,
            dirty_air_share,      # share of window laps within 1 s of the car ahead
            window_gap_mean,      # mean gap ahead over the window (capped at 10 s)
            pace_vs_field]        # reference pace minus the field median on the same laps
  dirty_air_s: 1.0

practice:
  # long runs from FP1-FP3: one set, enough green laps to fit a wear slope
  min_laps: 6
  min_span_laps: 5
  keep_band: [0.97, 1.04]     # laps within this band of the run's median (drops push / cool-down laps)
  fuel_s_per_lap: 0.06        # fuel burn makes a run ~0.06 s/lap faster; added back to the slope
  slope_range: [-0.3, 0.6]    # drop implausible slopes

cv:
  n_splits: 5                 # GroupKFold by race

lstm:
  retrain: true
  run_sweep: true             # 5 network sizes, same grouped folds as Setup B
  cv_seeds: 3                 # the chosen size is re-run with 3 seeds (stability check)

update:
  # online error correction of the Setup B forecast (stage `update`)
  step: 2                     # score a decision every 2nd observed lap
  k_grid: [3, 5, 8]           # how many recent errors to average
  shrink_grid: [0, 2, 5]      # shrink the correction when few errors have been seen

strategy:
  window_s: 1.0               # pit window = laps within this many seconds of the best
  # decision options, chosen on a 2024 backtest with models fit on earlier seasons
  options_grid:
    # The full grid was compared in reports/experiments (fit on 2023, backtest 2024):
    # re-deciding every lap gave the best within-3-laps rate. The pipeline re-checks
    # that choice against the single decision on 2024.
    monotone: [true]          # loss curves never improve as a set ages
    smooth: [false]           # straight-line fit of each curve (+2.5 pts single-decision, not combined)
    rolling: [false, true]    # re-decide after every lap instead of once
    update: [false]           # rolling: online error correction (no gain for the pit call in experiments)
