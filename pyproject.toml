[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall"
version = "0.1.0"
description = "Predicting F1 tire degradation to recommend pit stop timing (EM 538 capstone, Team 9)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "fastf1>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ipykernel"]
dl = ["torch>=2.2"]
app = ["streamlit>=1.35", "plotly>=5.20"]

[project.scripts]
pitwall = "pitwall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
